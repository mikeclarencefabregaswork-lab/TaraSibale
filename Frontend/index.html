<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaraSibale | Sibale Island Travel Guide</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/tarasibale-logo.jpg" />
    <meta
      name="description"
      content="Explore Sibale Island in Romblon. Find places to visit and stay, check ferry information, and plan your trip with TaraSibale." />
    <meta
      property="og:title"
      content="TaraSibale | Sibale Island Travel Guide" />
    <meta
      property="og:description"
      content="Explore Sibale Island in Romblon. Find places to visit and stay, check ferry information, and plan your trip with TaraSibale." />
    <meta property="og:image" content="/tarasibale-logo.jpg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tara_sibale_theme");
          var isDark =
            theme === "dark" ||
            (!theme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
