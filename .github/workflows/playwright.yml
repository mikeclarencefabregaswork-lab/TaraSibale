name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tarasibale
          POSTGRES_PASSWORD: smoke-test
          POSTGRES_DB: tarasibale_smoke
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tarasibale -d tarasibale_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tarasibale:smoke-test@127.0.0.1:55432/tarasibale_smoke
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Migrate and seed the smoke test database
      run: |
        # The workspace scripts require the file. DATABASE_URL comes from the job.
        touch Backend/.env
        npm run db:migrate
        npm run db:seed
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Run TaraSibale smoke test
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
